<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M-PLANET 운영 규칙</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #07090e;
            --bg-darker: #020408;
            --bg-card: rgba(15, 20, 32, 0.4);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --primary: #6366f1;
            --primary-glow: rgba(99, 102, 241, 0.4);
            --secondary: #a855f7;
            --secondary-glow: rgba(168, 85, 247, 0.4);
            --card-border: rgba(255, 255, 255, 0.08);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-darker);
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
        }

        * {
            box-sizing: border-box;
        }

        /* Glassmorphism utility */
        .glass {
            background: var(--bg-card);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--card-border);
            border-radius: 20px;
        }

        /* Base styles / Layout */
        .app-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            min-height: 100vh;
            position: relative;
            overflow: hidden;
        }

        /* Background gradient effects */
        .bg-gradient-circle {
            position: absolute;
            border-radius: 50%;
            filter: blur(120px);
            z-index: -1;
            opacity: 0.6;
        }

        .circle-1 {
            top: -15%;
            left: -20%;
            width: 70vw;
            height: 70vw;
            background: radial-gradient(circle, var(--primary), transparent 60%);
        }

        .circle-2 {
            bottom: -15%;
            right: -20%;
            width: 80vw;
            height: 80vw;
            background: radial-gradient(circle, var(--secondary), transparent 60%);
        }

        .hero-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            max-width: 1000px;
            position: relative;
            z-index: 10;
        }

        .hero-title {
            font-weight: 800;
            line-height: 1.25;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, #ffffff 20%, #e2e8f0 40%, var(--primary) 70%, var(--secondary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero-subtitle {
            font-weight: 500;
            color: var(--text-muted);
            letter-spacing: -0.01em;
        }

        .content-section {
            display: grid;
            gap: 2rem;
            width: 100%;
            position: relative;
            z-index: 10;
        }

        .info-card {
            padding: 2.5rem 2rem;
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .card-title {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-size: 1.4rem;
            font-weight: 700;
            margin-top: 0;
            margin-bottom: 1.25rem;
            color: #fff;
            letter-spacing: -0.01em;
        }

        .icon-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 44px;
            height: 44px;
            border-radius: 12px;
        }

        .icon-wrapper svg {
            width: 24px;
            height: 24px;
        }

        .bullet-list {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .bullet-list li {
            position: relative;
            padding-left: 1.75rem;
            font-size: 1.1rem;
            line-height: 1.5;
            color: var(--text-muted);
        }

        .bullet-list li::before {
            content: "✦";
            position: absolute;
            left: 0;
            top: 1px;
            color: var(--primary);
            font-size: 1.2rem;
        }

        .cta-button {
            display: inline-block;
            margin-top: 1rem;
            padding: 1.2rem 3rem;
            font-size: 1.2rem;
            font-weight: 700;
            color: #fff;
            border: none;
            border-radius: 40px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            letter-spacing: 0.05em;
        }

        .cta-button:hover {
            transform: scale(1.05) translateY(-2px);
        }

        .rule-card {
            margin-bottom: 1.5rem;
        }

        @media (max-width: 600px) {
            .hero-title {
                font-size: 2.2rem !important;
            }

            .info-card {
                padding: 2rem 1.5rem;
            }
        }
    </style>
</head>

<body>
    <div class="app-container">
        <!-- Background gradients -->
        <div class="bg-gradient-circle circle-1"></div>
        <div class="bg-gradient-circle circle-2"
            style="background: radial-gradient(circle, rgba(239, 68, 68, 0.4), transparent 60%);"></div>

        <header class="hero-section" style="padding-top: 80px; padding-bottom: 30px;">
            <h1 class="hero-title" style="font-size: 3rem; margin-bottom: 1rem;">
                M-PLANET 운영 규칙
            </h1>
            <p class="hero-subtitle" style="margin-bottom: 2rem;">
                건강하고 생산적인 생태계를 위한 약속입니다.
            </p>
        </header>

        <main class="content-section" style="grid-template-columns: 1fr; max-width: 800px; padding-bottom: 40px;">

            <div class="info-card glass rule-card">
                <h2 class="card-title" style="color: var(--primary);">
                    <div class="icon-wrapper" style="background: rgba(99, 102, 241, 0.1); color: var(--primary);">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                            class="lucide lucide-shield-check">
                            <path
                                d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z" />
                            <path d="m9 12 2 2 4-4" />
                        </svg>
                    </div>
                    상호 존중
                </h2>
                <ul class="bullet-list">
                    <li>직군 간의 비하 발언을 금지하고 서로 존중하는 태도를 유지합니다.</li>
                    <li>상호 간의 자유로운 의사 표현을 존중합니다.</li>
                </ul>
            </div>

            <div class="info-card glass rule-card">
                <h2 class="card-title" style="color: #ef4444;">
                    <div class="icon-wrapper" style="background: rgba(239, 68, 68, 0.1); color: #ef4444;">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                            class="lucide lucide-shield-check">
                            <path
                                d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z" />
                            <path d="m9 12 2 2 4-4" />
                        </svg>
                    </div>
                    금지 사항
                </h2>
                <ul class="bullet-list">
                    <li>강요나 억압적인 태도를 금지합니다.</li>
                    <li>다른 사람의 의견을 비난하는 행위를 금지합니다.</li>
                    <li>기타 불법적인 행위를 금지합니다.</li>
                </ul>
            </div>

            <div style="display: flex; justify-content: center; margin-top: 2rem;">
                <a href="index.html" class="cta-button"
                    style="text-decoration: none; display: inline-flex; align-items: center; gap: 0.5rem; background: var(--bg-card); border: 1px solid rgba(255,255,255,0.2); box-shadow: none; font-size: 1rem; padding: 0.8rem 2rem;">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                        class="lucide lucide-arrow-left">
                        <path d="m12 19-7-7 7-7" />
                        <path d="M19 12H5" />
                    </svg>
                    메인으로 돌아가기
                </a>
            </div>
        </main>
    </div>
</body>

</html>
